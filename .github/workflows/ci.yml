name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить CMake, компилятор и UnitTest++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libunittest++-dev
          cmake --version
          g++ --version

      - name: Настроить сборку
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Werror --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Собрать
        run: cmake --build build --parallel

      - name: Прогнать тесты
        run: ctest --test-dir build --output-on-failure

      - name: Собрать отчёт о покрытии
        working-directory: build
        run: |
          sudo apt-get install -y gcovr
          gcovr --root "$GITHUB_WORKSPACE" \
            --filter "$GITHUB_WORKSPACE/src/" \
            --filter "$GITHUB_WORKSPACE/include/" \
            --exclude '.*/main.cpp' --fail-under-line 90 --print-summary

  strict-warnings:
    name: Строгие предупреждения
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libunittest++-dev

      - run: >
          cmake -S . -B build-strict
          -DCMAKE_BUILD_TYPE=Debug
          -DSALARY_ENABLE_TESTS=OFF
          -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra -Wpedantic -Wshadow
          -Wnon-virtual-dtor -Wold-style-cast -Wcast-align -Wunused
          -Woverloaded-virtual -Wnull-dereference -Wdouble-promotion
          -Wformat=2 -Wimplicit-fallthrough"

      - name: Собрать с максимальными предупреждениями
        run: cmake --build build-strict --parallel

  code-quality:
    name: Формат и поиск мерзости
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y cmake g++ clang-format

      - name: Проверить clang-format
        run: |
          find src include tests main.cpp \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 -r clang-format --dry-run --Werror

      - name: Проверить отсутствие TODO и закомментированного кода
        run: |
          if grep -rn --include='*.cpp' --include='*.hpp' -E 'TODO|FIXME|XXX|HACK' src include tests main.cpp; then
            echo "Found forbidden comments"
            exit 1
          fi
          if grep -rn --include='*.cpp' --include='*.hpp' -E '^\s*//\s*(if|for|while|return|int|double|std::)' src include tests main.cpp; then
            echo "Found commented-out code"
            exit 1
          fi

  package:
    name: Сборка артефакта
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Установить инструменты
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Собрать релизный бинарник
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DSALARY_ENABLE_TESTS=OFF
          cmake --build build-release --target salary_sim --parallel
          mkdir -p dist/salary_sim
          cp build-release/salary_sim dist/salary_sim/salary_sim
          cp README.md dist/salary_sim/README.md
          tar -czf dist/salary_sim-linux-x86_64.tar.gz -C dist/salary_sim .

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist/*.tar.gz

      - name: Опубликовать Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
