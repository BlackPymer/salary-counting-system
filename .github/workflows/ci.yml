name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Новый запуск отменяет предыдущий для того же коммита: лишние запуски
# не нужны, а статус commit'а должен соответствовать последней проверке.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить CMake и компилятор
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          cmake --version
          g++ --version

      # -D — это опция НАСТРОЙКИ, а не сборки. Передавать её в
      # `cmake --build` бессмысленно: она попадёт в make, а не в компилятор.
      # Поэтому -Werror и --coverage задаются здесь, на шаге настройки.
      - name: Настроить сборку
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Werror --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Собрать
        run: cmake --build build --parallel

      - name: Прогнать тесты
        run: ctest --test-dir build --output-on-failure

      # Отчёт о покрытии виден только если сборка была с --coverage:
      # без этого gcovr находит ноль файлов .gcda и рисует пустые 0%.
      - name: Собрать отчёт о покрытии
        working-directory: build
        run: |
          sudo apt-get install -y gcovr
          gcovr --root .. --filter .. --print-summary

  strict-warnings:
    name: Строгие предупреждения
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y cmake g++

      # Флаги предупреждений — тоже опция настройки, не сборки.
      - run: >
          cmake -S . -B build-strict
          -DCMAKE_BUILD_TYPE=Debug
          -DSALARY_ENABLE_TESTS=OFF
          -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra -Wpedantic -Wshadow
          -Wnon-virtual-dtor -Wold-style-cast -Wcast-align -Wunused
          -Woverloaded-virtual -Wnull-dereference -Wdouble-promotion
          -Wformat=2 -Wimplicit-fallthrough"

      # Каждое предупреждение — провал. Отдельно от тестов: тесты могут
      # проходить, а в коде при этом остаться мусор из шаблонов и знаков.
      - name: Собрать с максимальными предупреждениями
        run: cmake --build build-strict --parallel

  code-quality:
    name: Формат и поиск мерзости
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y cmake g++ clang-format

      - name: Проверить clang-format
        run: |
          # Падает, если файлы не отформатированы под .clang-format.
          find src include tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Проверить отсутствие TODO и закомментированного кода
        run: |
          # Эти маркеры означают незаконченную работу, которая попадёт
          # в сдаваемый проект.
          ! grep -rn --include='*.cpp' --include='*.hpp' -E 'TODO|FIXME|XXX|HACK' src include tests
          ! grep -rn --include='*.cpp' --include='*.hpp' -E '^\s*//\s*(if|for|while|return|int|double|std::)' src include tests